      toggleFeat: () => this.setState({ feat: S.feat === cur.k ? '' : cur.k })

<script type="text/x-dc" id="js-AdminAddEvent">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.init = { name: '', type: 'Live music', rep: 'weekly', day: 'Thu', date: '', start: '', end: '', cap: '', price: 'free', amount: '', mode: 'request', desc: '', photo: false, live: true, feat: false };
    this.state = Object.assign({ saved: false }, this.init);
  }

  baseVals(fields, toggles) {
    const S = this.state;
    const set = {}; fields.forEach((k) => { set[k] = (e) => this.setState({ [k]: String(e.target.value || '') }); });
    const tg = {}; toggles.forEach((k) => { const on = !!S[k]; tg[k] = { on, cls: on ? 'sw on' : 'sw', flip: () => this.setState({ [k]: !on }) }; });
    const f = {}; fields.forEach((k) => { f[k] = S[k] || ''; });
    return { set, tg, f };
  }
  chipList(key, opts, multi) {
    const S = this.state;
    return opts.map((o) => {
      const v = Array.isArray(o) ? o[0] : o; const l = Array.isArray(o) ? o[1] : o;
      const on = multi ? (S[key] || []).indexOf(v) >= 0 : S[key] === v;
      return { label: l, on, cls: on ? 'chip on' : 'chip', pick: () => {
        if (multi) { const a = (S[key] || []).slice(); const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); this.setState({ [key]: a }); }
        else this.setState({ [key]: v });
      } };
    });
  }

  renderVals() {
    const S = this.state;

    const b = this.baseVals(['name', 'date', 'start', 'end', 'cap', 'amount', 'desc'], ['live', 'feat']);
    const once = S.rep === 'once';
    const paid = S.price === 'paid';
    const amt = String(S.amount).replace(/[^0-9]/g, '');
    const dayNames = { Sat: 'Saturdays', Sun: 'Sundays', Mon: 'Mondays', Tue: 'Tuesdays', Wed: 'Wednesdays', Thu: 'Thursdays', Fri: 'Fridays' };
    const miss = [];
    if (!S.name.trim()) miss.push('event name'); if (!S.start.trim()) miss.push('start time');
    if (once && !S.date.trim()) miss.push('date'); if (paid && !amt) miss.push('price');
    const time = (S.start || '[start]') + (S.end ? ' – ' + S.end : '');
    const when = once ? (S.date || '[date]') + ' · ' + time : (S.rep === 'monthly' ? 'One ' + S.day + ' a month' : dayNames[S.day]) + ' · ' + time;
    const priceLabel = S.price === 'free' ? 'Free entry' : (S.price === 'breakfast' ? 'Free with breakfast' : (amt ? 'EGP ' + amt : 'EGP —'));
    return Object.assign(b, {
      editing: !S.saved, saved: S.saved,
      types: this.chipList('type', ['Family', 'Workshops', 'Live music', 'Social nights', 'Seasonal']),
      repeats: this.chipList('rep', [['weekly', 'Every week'], ['monthly', 'Once a month'], ['once', 'One date']]),
      days: this.chipList('day', ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri']),
      prices: this.chipList('price', [['free', 'Free entry'], ['breakfast', 'Free with breakfast'], ['paid', 'Paid']]),
      modes: this.chipList('mode', [['request', 'Request form'], ['waitlist', 'Waitlist only'], ['walkin', 'Walk in, no booking']]),
      isRepeat: !once, isOnce: once, isPaid: paid,
      photoCls: S.photo ? 'slot ok' : 'slot', photoLabel: S.photo ? 'Poster photo added (sample)' : 'Add poster photo', noPhoto: true,
      addPhoto: () => this.setState({ photo: !S.photo }),
      badge: once ? (S.date ? S.date.split(' ').slice(0, 2).join(' ') : 'Date') : S.day, badgeSub: once ? 'One night' : (S.rep === 'monthly' ? 'Monthly' : 'Weekly'),
      typeLabel: S.type, pvName: S.name.trim() || 'Event name', pvWhen: when, pvDesc: S.desc.trim() || 'Short description shows here.',
      pvPrice: priceLabel + (S.cap ? ' · ' + S.cap + ' guests' : ''),
      ctaLabel: S.mode === 'waitlist' ? 'Join the waitlist' : (S.mode === 'walkin' ? 'Just drop by' : 'Request a spot'),
      statusLabel: S.live ? "Shows on What's on after saving" : 'Saved as draft (hidden)', statusCls: S.live ? 'pill p-green' : 'pill p-grey',
      missing: miss.length ? 'Still needed: ' + miss.join(', ') : 'Ready to add', cantSave: miss.length > 0,
      successBody: (S.live ? "It now shows on What's on" + (S.feat ? ' and on the homepage' : '') + '. ' : 'Saved as a draft. ') + (S.mode === 'walkin' ? 'Guests just drop by, so no requests will come in.' : 'Requests will arrive in Events, by date.'),
      save: () => this.setState({ saved: true }),
      again: () => this.setState(Object.assign({ saved: false }, this.init))
    });
  }
}

</script>
