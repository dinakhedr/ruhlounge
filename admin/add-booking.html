<script type="text/x-dc" id="js-AdminBookings2">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'pending', sel: 'BK-2381', status: {}, tables: {}, by: {}, declining: false, reason: 'Fully booked' };
  }

  tableMap(slot, guests, req, sel, onPick) {
    const AREAS = [
      { name: 'Indoor', bg: '#F6F0E6', fg: '#2F4536', t: [[1, 2], [2, 2], [3, 4], [4, 6], [5, 4], [6, 6], [7, 4], [8, 4], [9, 2], [10, 8]] },
      { name: 'Garden', bg: '#EEF2EA', fg: '#26382C', t: [[11, 4], [12, 6], [13, 6], [14, 4], [15, 4], [16, 4], [17, 8], [18, 2]] },
      { name: 'Pergola', bg: '#F7EBDD', fg: '#6B4520', t: [[19, 4], [20, 4], [21, 6], [22, 6], [23, 8], [24, 10]] }
    ];
    const BOOKED = {
      '1:00 PM': { 1: 'Farida M.', 2: 'Seif E.', 7: 'Reem A.', 20: 'Ali H.' },
      '8:00 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 15: 'Karim F.', 22: 'Nada S.' },
      '8:30 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 15: 'Karim F.', 22: 'Nada S.' },
      '9:00 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 12: 'Hazem F.', 15: 'Karim F.', 23: 'Malak N.' },
      '9:30 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 11: 'Youssef A.', 15: 'Karim F.', 23: 'Malak N.' },
      '10:00 PM': { 8: 'Hana S.', 11: 'Youssef A.', 23: 'Malak N.' },
      '10:30 PM': { 3: 'Amr G.', 4: 'Amr G.', 7: 'Tamer B.', 8: 'Hana S.', 11: 'Youssef A.', 15: 'Khaled O.' },
      '11:00 PM': { 7: 'Tamer B.', 24: 'Birthday · Yasmin R.' }
    };
    const HELD = { '8:30 PM': { 6: 'BK-2386' }, '9:00 PM': { 13: 'BK-2387' }, '10:30 PM': { 19: 'BK-2388' }, '1:00 PM': { 21: 'BK-2389' } };
    const booked = BOOKED[slot] || {}, held = HELD[slot] || {};
    let seatsSel = 0;
    const zones = AREAS.map((a) => {
      let free = 0;
      const tables = a.t.map(([n, seats]) => {
        const busy = !!booked[n];
        const on = !busy && sel.indexOf(n) >= 0;
        if (on) seatsSel += seats;
        const isHeld = !busy && !on && !!held[n];
        const small = !busy && !on && !isHeld && seats < guests;
        if (!busy && !isHeld) free++;
        const status = busy ? 'Booked · ' + booked[n] : (on ? 'Selected' : (isHeld ? 'Held · ' + held[n] : (small ? 'Free · small for ' + guests : 'Free')));
        const isReq = req === n;
        return {
          n, seats, busy, on, isReq, status,
          cls: 'tt s' + Math.min(seats, 10) + (busy ? ' busy' : (on ? ' on' : (isHeld ? ' held' : (small ? ' small' : ' free')))) + (isReq ? ' req' : ''),
          aria: 'Table ' + n + ', ' + a.name + ', ' + seats + ' seats, ' + status + (isReq ? ', requested by guest' : ''),
          pick: () => { if (busy) return; const s = sel.slice(); const i = s.indexOf(n); if (i >= 0) s.splice(i, 1); else { if (s.length >= 2) s.shift(); s.push(n); } onPick(s); }
        };
      });
      return { name: a.name, bg: a.bg, fg: a.fg, tables, freeLabel: free + ' free' };
    });
    const selList = sel.filter((n) => !booked[n]);
    const label = selList.length ? (selList.length > 1 ? 'Tables ' + selList.join(' + ') : 'Table ' + selList[0]) : '';
    let fitCls = 'fit none', fitText = 'No table selected yet.';
    if (selList.length) {
      if (seatsSel >= guests) { fitCls = 'fit ok'; fitText = label + ' · ' + seatsSel + ' seats for ' + guests + ' guests. Good fit.'; }
      else { fitCls = 'fit no'; fitText = label + ' · ' + seatsSel + ' seats for ' + guests + ' guests. Add a second table to join.'; }
    }
    let reqNote = '';
    if (req) {
      const rs = (AREAS.find((a) => a.t.some((x) => x[0] === req)) || { t: [] }).t.find((x) => x[0] === req);
      if (booked[req]) reqNote = 'Table ' + req + ' (requested by the guest) is already booked at ' + slot + '. Pick another table and mention it in the message.';
      else if (rs && rs[1] < guests && !(selList.indexOf(req) >= 0 && seatsSel >= guests)) reqNote = 'Table ' + req + ' (requested by the guest) has ' + rs[1] + ' seats for ' + guests + ' guests. Join it with a nearby table.';
    }
    return { zones, label, seatsSel, fits: selList.length > 0 && seatsSel >= guests, fitCls, fitText, reqNote, booked };
  }

  renderVals() {
    const S = this.state;
    const D = { 'Today': ['THU', '12', 'NOV', 'Thursday 12 Nov', 'Tonight'], 'Fri 13 Nov': ['FRI', '13', 'NOV', 'Friday 13 Nov', 'Tomorrow'], 'Sat 14 Nov': ['SAT', '14', 'NOV', 'Saturday 14 Nov', 'In 2 days'] };
    const base = [
      { id: 'BK-2381', name: 'Nour Hassan', short: 'Nour', phone: '+20 100 571 6027', level: 'Regular · 820 pts', date: 'Fri 13 Nov', time: '8:30 PM', guests: 6, occasion: 'Birthday', pref: 12, note: 'Birthday cake around 10 PM, please.', ago: '25 min ago', status: 'pending' },
      { id: 'BK-2382', name: 'Youssef Adel', short: 'Youssef', phone: '+20 111 234 8890', level: 'Friend · 120 pts', date: 'Fri 13 Nov', time: '9:00 PM', guests: 4, occasion: 'Hangout', pref: null, note: '', ago: '17 min ago', status: 'pending' },
      { id: 'BK-2383', name: 'Laila Mansour', short: 'Laila', phone: '+20 122 908 4415', level: 'Not a member yet', date: 'Sat 14 Nov', time: '1:00 PM', guests: 9, occasion: 'Family lunch', pref: 3, note: 'Two kids with us, a high chair would help.', ago: '12 min ago', status: 'pending' },
      { id: 'BK-2384', name: 'Omar Khalil', short: 'Omar', phone: '+20 106 552 0173', level: 'Family · 1,720 pts', date: 'Today', time: '10:30 PM', guests: 2, occasion: 'Date night', pref: 7, note: '', ago: '6 min ago', status: 'pending' },
      { id: 'BK-2375', name: 'Karim Fawzy', short: 'Karim', phone: '+20 100 774 2291', level: 'Regular · 640 pts', date: 'Today', time: '8:00 PM', guests: 5, occasion: 'Hangout', pref: null, note: '', ago: '3 h ago', status: 'confirmed', t: [15, 14], by: 'Confirmed by Salma K. · 6:12 PM' },
      { id: 'BK-2377', name: 'Hana Samir', short: 'Hana', phone: '+20 109 330 6612', level: 'Friend · 260 pts', date: 'Today', time: '8:30 PM', guests: 3, occasion: 'Catch-up', pref: 8, note: '', ago: '4 h ago', status: 'confirmed', t: [8], by: 'Confirmed by Ruh owner · 5:40 PM' },
      { id: 'BK-2370', name: 'Tarek Nabil', short: 'Tarek', phone: '+20 115 802 3347', level: 'Not a member yet', date: 'Fri 13 Nov', time: '11:00 PM', guests: 14, occasion: 'Hangout', pref: null, note: '', ago: '1 day ago', status: 'declined', by: 'Declined by Salma K. · fully booked, offered 9 PM' },
      { id: 'BK-2372', name: 'Dalia Ramzy', short: 'Dalia', phone: '+20 127 450 9038', level: 'Friend · 90 pts', date: 'Today', time: '1:00 PM', guests: 4, occasion: 'Family dinner', pref: null, note: '', ago: '6 h ago', status: 'cancelled', by: 'Cancelled by the guest from her profile · 4:05 PM' }
    ];
    const labels = { pending: 'Pending', confirmed: 'Confirmed', declined: 'Declined', cancelled: 'Cancelled' };
    const all = base.map((b) => {
      const status = S.status[b.id] || b.status;
      const d = D[b.date];
      const tables = S.tables[b.id] || b.t || (b.pref ? [b.pref] : []);
      return Object.assign({}, b, {
        status, tables, mon: d[2], day: d[1], wk: d[0], longDate: d[3], rel: d[4],
        by: S.by[b.id] || b.by || '', statusLabel: labels[status], pillCls: 'pill st-' + status,
        reqLabel: b.pref ? 'Table ' + b.pref : 'any table', noteText: b.note || 'No note.',
        tableHint: status === 'confirmed' ? (tables.length > 1 ? 'Tables ' + tables.join(' + ') : 'Table ' + tables[0]) : (b.pref ? 'asked for Table ' + b.pref : 'any table'),
        tablesLabel: tables.length > 1 ? 'Tables ' + tables.join(' + ') : 'Table ' + tables[0], tablesShort: tables.join('+')
      });
    });
    const list = all.filter((b) => b.status === S.tab);
    const cur = all.find((b) => b.id === S.sel) || list[0] || all[0];
    const map = this.tableMap(cur.time, cur.guests, cur.pref, cur.status === 'pending' ? (S.tables[cur.id] || (cur.pref ? [cur.pref] : [])) : cur.tables,
      (s) => { const t = Object.assign({}, S.tables); t[cur.id] = s; this.setState({ tables: t }); });
    const tbl = map.label || '[choose a table]';
    const confirmMsg = 'Hi ' + cur.short + ', your table at Ruh is confirmed.\n' + cur.longDate + ', ' + cur.time + ' · ' + cur.guests + ' guests · ' + (cur.status === 'confirmed' ? cur.tablesLabel : tbl) + '\nScan the QR code on your table to check in and earn Ruh Circle points.\nNeed to change anything? Just reply here.\nRuh Lounge, Izar Plaza, Sheikh Zayed';
    const reasonText = {
      'Fully booked': 'we are fully booked at ' + cur.time + ' on ' + cur.longDate + '. We can offer an earlier or later time if that works for you.',
      'Group too large for that time': 'we cannot seat ' + cur.guests + ' guests together at ' + cur.time + '. Could another time work?',
      'Outside opening hours': 'that time is outside our hours (every day 11 AM to 2 AM).',
      'Other': '[write the reason here].'
    };
    const me = (typeof window !== 'undefined' && window.ADMU) ? window.ADMU() : 'Salma K.';
    return {
      tabs: ['pending', 'confirmed', 'declined', 'cancelled'].map((k) => ({ label: labels[k], on: S.tab === k, cls: S.tab === k ? 'tab on' : 'tab', count: all.filter((b) => b.status === k).length,
        pick: () => { const f = all.find((b) => b.status === k); this.setState({ tab: k, sel: f ? f.id : S.sel, declining: false }); } })),
      rows: list.map((b) => Object.assign({}, b, { rowCls: b.id === cur.id ? 'r2 sel' : 'r2', pick: () => this.setState({ sel: b.id, declining: false }) })),
      cur, map, zones: map.zones, fitCls: map.fitCls, fitText: map.fitText, hasReqNote: !!map.reqNote,
      mapTitle: 'Table map · ' + cur.longDate + ' at ' + cur.time,
      confirmMsg, declineMsg: 'Hi ' + cur.short + ', thank you for choosing Ruh. Sorry, ' + reasonText[S.reason] + '\nReply here and we will find you a table.',
      isPending: cur.status === 'pending', isConfirmed: cur.status === 'confirmed', isClosed: cur.status === 'declined' || cur.status === 'cancelled',
      declining: S.declining, notDeclining: !S.declining,
      cantConfirm: !map.fits, confirmLabel: map.fits ? 'Confirm ' + map.label + ' & send on WhatsApp' : 'Choose tables with enough seats',
      reasons: ['Fully booked', 'Group too large for that time', 'Outside opening hours', 'Other'].map((r) => ({ label: r, on: S.reason === r, cls: S.reason === r ? 'chip on' : 'chip', pick: () => this.setState({ reason: r }) })),
      confirm: () => {
        const st = Object.assign({}, S.status); st[cur.id] = 'confirmed';
        const t = Object.assign({}, S.tables); t[cur.id] = map.label.replace(/[^0-9+]/g, '').split('+').map(Number);
        const by = Object.assign({}, S.by); by[cur.id] = 'Confirmed by ' + me + ' · just now';
        this.setState({ status: st, tables: t, by, tab: 'confirmed', declining: false });
      },
      decline: () => {
        const st = Object.assign({}, S.status); st[cur.id] = 'declined';
        const by = Object.assign({}, S.by); by[cur.id] = 'Declined by ' + me + ' · just now · ' + S.reason.toLowerCase();
        this.setState({ status: st, by, tab: 'declined', declining: false });
      },
      reopen: () => { const st = Object.assign({}, S.status); st[cur.id] = 'pending'; this.setState({ status: st, tab: 'pending' }); },
      startDecline: () => this.setState({ declining: true }),
      stopDecline: () => this.setState({ declining: false })
    };
  }
}

<script type="text/x-dc" id="js-AdminAddBooking2">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.init = { mobile: '', name: '', src: 'phone', date: 'Fri 13 Nov', time: '9:00 PM', guests: 4, occ: 'Hangout', tables: [], note: '', send: true, look: '' };
    this.state = Object.assign({ saved: false }, this.init);
  }

  baseVals(fields, toggles) {
    const S = this.state;
    const set = {}; fields.forEach((k) => { set[k] = (e) => this.setState({ [k]: String(e.target.value || '') }); });
    const tg = {}; toggles.forEach((k) => { const on = !!S[k]; tg[k] = { on, cls: on ? 'sw on' : 'sw', flip: () => this.setState({ [k]: !on }) }; });
    const f = {}; fields.forEach((k) => { f[k] = S[k] || ''; });
    return { set, tg, f };
  }
  chipList(key, opts, multi) {
    const S = this.state;
    return opts.map((o) => {
      const v = Array.isArray(o) ? o[0] : o; const l = Array.isArray(o) ? o[1] : o;
      const on = multi ? (S[key] || []).indexOf(v) >= 0 : S[key] === v;
      return { label: l, on, cls: on ? 'chip on' : 'chip', pick: () => {
        if (multi) { const a = (S[key] || []).slice(); const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); this.setState({ [key]: a }); }
        else this.setState({ [key]: v });
      } };
    });
  }

  tableMap(slot, guests, req, sel, onPick) {
    const AREAS = [
      { name: 'Indoor', bg: '#F6F0E6', fg: '#2F4536', t: [[1, 2], [2, 2], [3, 4], [4, 6], [5, 4], [6, 6], [7, 4], [8, 4], [9, 2], [10, 8]] },
      { name: 'Garden', bg: '#EEF2EA', fg: '#26382C', t: [[11, 4], [12, 6], [13, 6], [14, 4], [15, 4], [16, 4], [17, 8], [18, 2]] },
      { name: 'Pergola', bg: '#F7EBDD', fg: '#6B4520', t: [[19, 4], [20, 4], [21, 6], [22, 6], [23, 8], [24, 10]] }
    ];
    const BOOKED = {
      '1:00 PM': { 1: 'Farida M.', 2: 'Seif E.', 7: 'Reem A.', 20: 'Ali H.' },
      '8:00 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 15: 'Karim F.', 22: 'Nada S.' },
      '8:30 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 15: 'Karim F.', 22: 'Nada S.' },
      '9:00 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 12: 'Hazem F.', 15: 'Karim F.', 23: 'Malak N.' },
      '9:30 PM': { 3: 'Group · Laila M.', 4: 'Group · Laila M.', 8: 'Hana S.', 11: 'Youssef A.', 15: 'Karim F.', 23: 'Malak N.' },
      '10:00 PM': { 8: 'Hana S.', 11: 'Youssef A.', 23: 'Malak N.' },
      '10:30 PM': { 3: 'Amr G.', 4: 'Amr G.', 7: 'Tamer B.', 8: 'Hana S.', 11: 'Youssef A.', 15: 'Khaled O.' },
      '11:00 PM': { 7: 'Tamer B.', 24: 'Birthday · Yasmin R.' }
    };
    const HELD = { '8:30 PM': { 6: 'BK-2386' }, '9:00 PM': { 13: 'BK-2387' }, '10:30 PM': { 19: 'BK-2388' }, '1:00 PM': { 21: 'BK-2389' } };
    const booked = BOOKED[slot] || {}, held = HELD[slot] || {};
    let seatsSel = 0;
    const zones = AREAS.map((a) => {
      let free = 0;
      const tables = a.t.map(([n, seats]) => {
        const busy = !!booked[n];
        const on = !busy && sel.indexOf(n) >= 0;
        if (on) seatsSel += seats;
        const isHeld = !busy && !on && !!held[n];
        const small = !busy && !on && !isHeld && seats < guests;
        if (!busy && !isHeld) free++;
        const status = busy ? 'Booked · ' + booked[n] : (on ? 'Selected' : (isHeld ? 'Held · ' + held[n] : (small ? 'Free · small for ' + guests : 'Free')));
        const isReq = req === n;
        return {
          n, seats, busy, on, isReq, status,
          cls: 'tt s' + Math.min(seats, 10) + (busy ? ' busy' : (on ? ' on' : (isHeld ? ' held' : (small ? ' small' : ' free')))) + (isReq ? ' req' : ''),
          aria: 'Table ' + n + ', ' + a.name + ', ' + seats + ' seats, ' + status + (isReq ? ', requested by guest' : ''),
          pick: () => { if (busy) return; const s = sel.slice(); const i = s.indexOf(n); if (i >= 0) s.splice(i, 1); else { if (s.length >= 2) s.shift(); s.push(n); } onPick(s); }
        };
      });
      return { name: a.name, bg: a.bg, fg: a.fg, tables, freeLabel: free + ' free' };
    });
    const selList = sel.filter((n) => !booked[n]);
    const label = selList.length ? (selList.length > 1 ? 'Tables ' + selList.join(' + ') : 'Table ' + selList[0]) : '';
    let fitCls = 'fit none', fitText = 'No table selected yet.';
    if (selList.length) {
      if (seatsSel >= guests) { fitCls = 'fit ok'; fitText = label + ' · ' + seatsSel + ' seats for ' + guests + ' guests. Good fit.'; }
      else { fitCls = 'fit no'; fitText = label + ' · ' + seatsSel + ' seats for ' + guests + ' guests. Add a second table to join.'; }
    }
    let reqNote = '';
    if (req) {
      const rs = (AREAS.find((a) => a.t.some((x) => x[0] === req)) || { t: [] }).t.find((x) => x[0] === req);
      if (booked[req]) reqNote = 'Table ' + req + ' (requested by the guest) is already booked at ' + slot + '. Pick another table and mention it in the message.';
      else if (rs && rs[1] < guests && !(selList.indexOf(req) >= 0 && seatsSel >= guests)) reqNote = 'Table ' + req + ' (requested by the guest) has ' + rs[1] + ' seats for ' + guests + ' guests. Join it with a nearby table.';
    }
    return { zones, label, seatsSel, fits: selList.length > 0 && seatsSel >= guests, fitCls, fitText, reqNote, booked };
  }

  renderVals() {
    const S = this.state;

    const b = this.baseVals(['mobile', 'name', 'note'], ['send']);
    const map = this.tableMap(S.time, S.guests, null, S.tables, (s) => this.setState({ tables: s }));
    const table = map.label;
    const digits = String(S.mobile).replace(/[^0-9]/g, '');
    const miss = []; if (digits.length < 10) miss.push('mobile'); if (!S.name.trim()) miss.push('name'); if (!map.fits) miss.push(map.label ? 'more seats' : 'table');
    const first = (S.name.trim().split(' ')[0]) || '[name]';
    const srcLabel = { phone: 'Phone call', whatsapp: 'WhatsApp', walkin: 'Walk-in', instagram: 'Instagram' }[S.src];
    return Object.assign(b, {
      editing: !S.saved, saved: S.saved,
      found: S.look === 'yes', notFound: S.look === 'no',
      lookup: () => { if (digits.indexOf('1005716027') >= 0) this.setState({ look: 'yes', name: 'Nour Hassan' }); else this.setState({ look: digits.length >= 10 ? 'no' : '' }); },
      sources: this.chipList('src', [['phone', 'Phone call'], ['whatsapp', 'WhatsApp'], ['walkin', 'Walk-in'], ['instagram', 'Instagram']]),
      dates: this.chipList('date', [['Today', 'Today'], ['Fri 13 Nov', 'Fri 13'], ['Sat 14 Nov', 'Sat 14'], ['Sun 15 Nov', 'Sun 15']]),
      times: this.chipList('time', ['1:00 PM', '8:00 PM', '8:30 PM', '9:00 PM', '9:30 PM', '10:00 PM', '10:30 PM', '11:00 PM']),
      occasions: this.chipList('occ', ['Hangout', 'Birthday', 'Family', 'Date night', 'Work']),
      guests: S.guests, less: () => this.setState({ guests: Math.max(1, S.guests - 1) }), more: () => this.setState({ guests: S.guests + 1 }),
      zones: map.zones, fitCls: map.fitCls, fitText: map.fitText, mapTitle: 'Table map · ' + S.date + ' at ' + S.time,
      pvName: S.name.trim() || 'Guest name',
      pvWhen: S.date + ', ' + S.time + ' · ' + S.guests + ' guests · ' + (table || 'no table yet'),
      pvMeta: S.occ + ' · via ' + srcLabel + (S.note ? ' · ' + S.note : ''),
      sendOn: !!S.send,
      msg: 'Hi ' + first + ', your table at Ruh is confirmed.\n' + S.date + ', ' + S.time + ' · ' + S.guests + ' guests · ' + (table || '[table]') + '\nScan the QR code on your table to check in and earn Ruh Circle points.\nRuh Lounge, Izar Plaza, Sheikh Zayed',
      missing: miss.length ? 'Still needed: ' + miss.join(', ') : 'Ready to add', cantSave: miss.length > 0,
      successBody: 'Saved as Confirmed for ' + S.date + ', ' + S.time + (table ? ' at ' + table : '') + '. ' + (S.send ? 'WhatsApp opens with the confirmation ready to send.' : 'No message sent.') + ' It shows on the dashboard under Tonight at Ruh on the day.',
      save: () => this.setState({ saved: true }),
      again: () => this.setState(Object.assign({ saved: false }, this.init))
    });
  }
}

</script>
