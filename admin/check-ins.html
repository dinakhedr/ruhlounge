<script type="text/x-dc" id="js-AdminCheckins">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'bill', sel: 'c1', stage: {}, bill: { c1: '1860' }, by: {} };
  }
  renderVals() {
    const S = this.state;
    const C = [
      { id: 'c1', table: 9, name: 'Ahmed Reda', short: 'Ahmed', phone: '+20 101 334 2289', level: 'Regular · 1,105 pts', pts: 1105, time: '7:40 PM', origin: 'Member walk-in', stage: 'bill', bday: false },
      { id: 'c2', table: 15, name: 'Karim Fawzy', short: 'Karim', phone: '+20 100 774 2291', level: 'Regular · 640 pts', pts: 640, time: '8:05 PM', origin: 'Booking BK-2375', stage: 'bill', bday: true },
      { id: 'c3', table: 21, name: 'Mona Tarek', short: 'Mona', phone: '+20 115 640 2287', level: 'New member · joined tonight', pts: 0, time: '8:50 PM', origin: 'Walk-in · joined Ruh Circle', stage: 'bill', bday: false },
      { id: 'c4', table: 6, name: 'Youssef Adel', short: 'Youssef', phone: '+20 111 234 8890', level: 'Friend · 120 pts', pts: 120, time: '9:18 PM', origin: 'Member walk-in', stage: 'confirm', bday: false },
      { id: 'c5', table: 11, name: 'Nour Hassan', short: 'Nour', phone: '+20 100 571 6027', level: 'Regular · 820 pts', pts: 820, time: '9:24 PM', origin: 'Member walk-in', stage: 'confirm', bday: false },
      { id: 'c6', table: 8, name: 'Hana Samir', short: 'Hana', phone: '+20 109 330 6612', level: 'Friend · 260 pts', pts: 260, time: '6:30 PM', origin: 'Booking BK-2377', stage: 'done', bday: false, credited: 172, by: 'Credited by Salma K. · 8:12 PM · bill EGP 1,220' },
      { id: 'c7', table: 2, name: 'Farida Magdy', short: 'Farida', phone: '+20 122 811 9046', level: 'Family · 1,560 pts', pts: 1560, time: '5:10 PM', origin: 'Member walk-in', stage: 'done', bday: false, credited: 245, by: 'Credited by Salma K. · 7:02 PM · bill EGP 1,950' }
    ];
    const fmt = (n) => n.toLocaleString('en-US');
    const all = C.map((c) => Object.assign({}, c, { stage: S.stage[c.id] || c.stage, by: S.by[c.id] || c.by || '' }));
    const labels = { confirm: 'To confirm', bill: 'Bill to enter', done: 'Credited', rejected: 'Not confirmed' };
    const pills = { confirm: 'pill p-terra', bill: 'pill p-wood', done: 'pill p-green', rejected: 'pill p-grey' };
    const inTab = (c) => S.tab === 'done' ? (c.stage === 'done' || c.stage === 'rejected') : c.stage === S.tab;
    const list = all.filter(inTab);
    const cur = all.find((c) => c.id === S.sel) || list[0] || all[0];
    const billNum = parseInt(S.bill[cur.id] || '0', 10) || 0;
    const billPts = Math.floor(billNum / 10);
    const base = 50 + billPts;
    const bonus = cur.bday ? base : 0;
    const total = base + bonus;
    const newBal = cur.pts + total;
    const lvl = newBal >= 1500 ? 'Family level' : (newBal >= 500 ? 'Regular · ' + fmt(1500 - newBal) + ' to Family' : 'Friend · ' + fmt(500 - newBal) + ' to Regular');
    const set = (k, v) => { const o = Object.assign({}, S[k]); o[cur.id] = v; return o; };
    const msgs = {
      confirm: 'Hi ' + cur.short + ', you are checked in at Table ' + cur.table + '. Enjoy your time at Ruh!',
      bill: 'Hi ' + cur.short + ', thank you for visiting Ruh tonight. You earned +' + total + ' Ruh Circle points (' + fmt(newBal) + ' in total).' + (cur.bday ? ' Happy birthday month: your points were doubled.' : '') + '\nSee where you stand on this month\'s leaderboard: [LINK]',
      done: 'Points sent to ' + cur.short + ' on WhatsApp.', rejected: 'No message sent.'
    };
    const tabs = [['confirm', 'To confirm'], ['bill', 'Bill to enter'], ['done', 'Credited today']].map(([k, l]) => ({
      label: l, on: S.tab === k, cls: S.tab === k ? 'tab on' : 'tab',
      count: all.filter((c) => k === 'done' ? (c.stage === 'done' || c.stage === 'rejected') : c.stage === k).length,
      pick: () => { const f = all.find((c) => k === 'done' ? (c.stage === 'done' || c.stage === 'rejected') : c.stage === k); this.setState({ tab: k, sel: f ? f.id : S.sel }); }
    }));
    return {
      tabs,
      rows: list.map((c) => Object.assign({}, c, { cls: c.id === cur.id ? 'cc sel' : 'cc', stageLabel: labels[c.stage], pillCls: pills[c.stage], timeLine: 'Checked in ' + c.time + (c.credited ? ' · +' + c.credited + ' pts' : ''), pick: () => this.setState({ sel: c.id }) })),
      emptyNote: list.length ? '' : 'Nothing here right now.',
      cur,
      isConfirm: cur.stage === 'confirm', isBill: cur.stage === 'bill', isDone: cur.stage === 'done' || cur.stage === 'rejected',
      doneTitle: cur.stage === 'rejected' ? 'Check-in not confirmed' : 'Points credited',
      billStr: S.bill[cur.id] || '',
      setBill: (e) => this.setState({ bill: set('bill', String(e.target.value || '').replace(/[^0-9]/g, '')) }),
      quick: [850, 1200, 1860, 2400].map((v) => ({ label: 'EGP ' + fmt(v), pick: () => this.setState({ bill: set('bill', String(v)) }) })),
      billPts, total, newBal: fmt(newBal), levelNote: lvl,
      bonusLabel: cur.bday ? 'Birthday month · points ×2' : 'Bonus', bonusPts: cur.bday ? '+' + bonus : '—',
      noBill: !billNum,
      msg: msgs[cur.stage],
      confirmTable: () => this.setState({ stage: set('stage', 'bill'), tab: 'bill' }),
      rejectTable: () => this.setState({ stage: set('stage', 'rejected'), by: set('by', 'Marked by ' + (window.ADMU ? ADMU() : 'Salma K.') + ' · just now · guest asked to scan again'), tab: 'done' }),
      credit: () => this.setState({ stage: set('stage', 'done'), by: set('by', 'Credited by ' + (window.ADMU ? ADMU() : 'Salma K.') + ' · just now · bill EGP ' + fmt(billNum) + ' · +' + total + ' pts'), tab: 'done' })
    };
  }
}

</script>
