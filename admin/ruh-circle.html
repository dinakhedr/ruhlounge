<style>
body{margin:0;background:#F6F0E6}
a{color:#2F4536}a:hover{color:#B4553E}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:#EBD8CB;text-decoration:none;font-size:15px;font-weight:600}
.nav:hover{background:rgba(235,216,203,.08);color:#FFF8EE}
.nav.on{background:#F6F0E6;color:#1F2E24}

.sub{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 46px;border-radius:10px;color:#C9D3CB;text-decoration:none;font-size:14px;font-weight:500}
.sub:hover{color:#FFF8EE}
.sub.on{color:#FFF8EE;font-weight:700;background:rgba(235,216,203,.1)}
.bdg{margin-left:auto;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#B4553E;color:#FFF;font-size:12px;font-weight:700;display:grid;place-items:center}
.card{background:#FBF7F0;border:1px solid #E6DACA;border-radius:22px;padding:24px;box-sizing:border-box;min-width:0}
.panel{background:#FFF;border:1px solid #E6DACA;border-radius:24px;padding:26px;box-sizing:border-box;min-width:0;box-shadow:0 18px 40px rgba(31,46,36,.08)}
.h2{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.02em;color:#1F2E24}
.h3{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.03em;color:#1F2E24}
.k{margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A5530}
.mut{color:#5C6B60}
.big{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#1F2E24}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:#E3EADF;color:#26382C}.p-terra{background:#F2DED3;color:#8A3B28}.p-wood{background:#EEDFC9;color:#6B4520}.p-blue{background:#DCE3EC;color:#26384C}.p-grey{background:#E9E2D8;color:#5A4A3A}.p-dark{background:#2F4536;color:#FFF8EE}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:#B4553E;color:#FFF8EE;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#2F4536;color:#FFF8EE}
.btn:disabled{background:#CDBFAC;color:#5A4A3A;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.green{background:#2F4536}.btn.green:hover{background:#B4553E}
.ghost{background:transparent;color:#2F4536;border:1.5px solid #CDBFAC}
.ghost:hover{background:#2F4536;border-color:#2F4536;color:#FFF8EE}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #D9CBB8;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:#2F4536;cursor:pointer}
.tab:hover{border-color:#2F4536}
.tab.on{background:#2F4536;border-color:#2F4536;color:#FFF8EE}
.tab .n{font-size:12px;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #D9CBB8;background:#FFF;font-family:inherit;font-size:14px;font-weight:600;color:#2F4536;cursor:pointer}
.chip:hover{border-color:#2F4536}
.chip.on{background:#1F2E24;border-color:#1F2E24;color:#FFF8EE}
.inp{font-family:inherit;font-size:15px;font-weight:600;color:#1F2A22;background:#FFF;border:1.5px solid #E2D5C3;border-radius:14px;min-height:48px;padding:0 14px;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#B4553E;box-shadow:0 0 0 4px rgba(180,85,62,.14)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.5;font-weight:500}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#2F4536}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid #EADFD0}
.rowb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:0;border-top:1px solid #EADFD0;background:transparent;font-family:inherit;font-size:14px;color:#1F2A22;cursor:pointer}
.rowb:hover{background:#F3EBDF}
.rowb.sel{background:#FFF;box-shadow:inset 4px 0 0 #B4553E}
.th{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7A5530;background:#F3EBDF}
.bar{height:10px;border-radius:999px;background:#EADFD0;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:#2F4536}
.wa{background:#E8F0E4;border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:14px;line-height:1.55;color:#1F2A22;white-space:pre-line}
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:999px;border:0;background:#CDBFAC;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFF;transition:left .2s}
.sw.on{background:#2F4536}
.sw.on::after{left:21px}
.ph{background:repeating-linear-gradient(135deg,#EFE6D8 0 10px,#E8DCCB 10px 20px);display:grid;place-items:center;color:#7A5530}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes ad-in{0%{transform:translateY(6px)}100%{transform:translateY(0)}}
.in{animation:ad-in .35s ease-out}
@keyframes ad-pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,85,62,.45)}50%{box-shadow:0 0 0 7px rgba(180,85,62,0)}}
.live{width:9px;height:9px;border-radius:50%;background:#B4553E;animation:ad-pulse 2s ease-in-out infinite;flex:none}
@media (prefers-reduced-motion:reduce){.in,.live{animation:none}}
</style>
</helmet>

<a class="nav" href="AdminHome.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Ruh at Home<span class="bdg">2</span></a>

<a class="nav on" href="AdminCircle.dc.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"></path></svg>Ruh Circle</a>
<a class="nav" href="AdminMenu.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg>Content</a>

<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(235,216,203,.07)"><span style="width:40px;height:40px;border-radius:50%;background:#B4553E;color:#FFF8EE;display:grid;place-items:center;font-weight:700">RO</span><span style="display:flex;flex-direction:column;min-width:0"><strong style="font-size:14px;color:#FFF8EE">Ruh owner</strong><span style="font-size:12px;color:#C9D3CB">Super admin · full access</span></span></div>
</aside>
<main style="flex:999 1 560px;min-width:0;padding:30px 36px 44px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px">
<header style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px"><div style="display:flex;flex-direction:column;gap:6px"><p class="k">Members, points and rewards</p><h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.035em;color:#1F2E24">Ruh Circle<span style="color:#B4553E">.</span></h1></div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><label style="display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:999px;background:#FBF7F0;border:1px solid #E2D5C3;color:#5C6B60;width:300px;max-width:100%;box-sizing:border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg><span class="sr">Search</span><input type="search" placeholder="Name or mobile" style="border:0;background:transparent;font-family:inherit;font-size:14px;flex:1;min-width:0;outline:none;color:#1F2A22"></label><a class="btn green" href="AdminAddMember.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add member</a></div></header>
<section aria-label="Circle in numbers" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px">
  <div class="card" style="background:#2F4536;border-color:#2F4536;color:#FFF8EE;display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#EBD8CB">Members</span><span class="big" style="color:#FFF8EE">612</span><span style="font-size:13px;color:#C9D3CB">+46 this month</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#4F5C52">By level</span><span style="font-size:15px"><strong>410</strong> Friend · <strong>168</strong> Regular · <strong>34</strong> Family</span><div style="display:flex;height:10px;border-radius:999px;overflow:hidden"><span style="width:67%;background:#EBD8CB"></span><span style="width:27%;background:#B9834A"></span><span style="width:6%;background:#2F4536"></span></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#4F5C52">Points credited · November</span><span class="big">18.4k</span><span class="mut" style="font-size:13px">from 312 check-ins, events and boxes</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:700;color:#4F5C52">Leaderboard resets</span><span class="big">18 days</span><span style="font-size:13px;color:#8A3B28;font-weight:700">Prizes not set yet</span></div>
</section>

<div role="tablist" aria-label="Ruh Circle sections" style="display:flex;flex-wrap:wrap;gap:10px">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
    <button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button>
  </sc-for>
</div>

<sc-if value="{{isMembers}}" hint-placeholder-val="{{true}}">
  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
    <section aria-label="Members" style="flex:1.5 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="4">
          <button type="button" class="{{l.cls}}" aria-pressed="{{l.on}}" onClick="{{l.pick}}">{{l.label}}</button>
        </sc-for>
      </div>
      <div style="background:#FBF7F0;border:1px solid #E6DACA;border-radius:20px;overflow:hidden"><div style="overflow-x:auto"><div style="min-width:640px">
        <div class="row th" aria-hidden="true"><span style="flex:1">Member</span><span style="width:96px">Level</span><span style="width:80px">Points</span><span style="width:60px">Visits</span><span style="width:110px">Last visit</span></div>
        <sc-for list="{{members}}" as="m" hint-placeholder-count="8">
          <button type="button" class="{{m.cls}}" onClick="{{m.pick}}">
            <span style="flex:1;min-width:0;display:flex;align-items:center;gap:10px"><span style="width:34px;height:34px;flex:none;border-radius:50%;background:#EBD8CB;color:#1F2E24;display:grid;place-items:center;font-weight:700;font-size:13px">{{m.ini}}</span><span style="display:flex;flex-direction:column;min-width:0"><strong style="font-size:15px">{{m.name}}</strong><span class="mut" style="font-size:12px">{{m.phone}}</span></span></span>
            <span style="width:96px"><span class="{{m.lvlCls}}">{{m.level}}</span></span>
            <span style="width:80px;font-weight:700">{{m.ptsStr}}</span>
            <span style="width:60px">{{m.visits}}</span>
            <span style="width:110px" class="mut">{{m.last}}</span>
          </button>
        </sc-for>
      </div></div></div>
      <p style="margin:0;font-size:13px" class="mut">Showing 10 of 612 members. Export to Excel for the full list.</p>
    </section>

    <section class="panel in" aria-labelledby="mb-h" style="flex:1 1 380px;display:flex;flex-direction:column;gap:18px">
      <div style="border-radius:22px;background:#1F2E24;color:#FFF8EE;padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:center"><img src="images/logo.png" alt="Ruh" style="height:30px;width:auto"><span class="pill" style="background:#F2B9A6;color:#1F2E24">{{cur.level}}</span></div>
        <h2 id="mb-h" style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.03em">{{cur.name}}</h2>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#C9D3CB"><span>{{cur.phone}}</span><span>Member since {{cur.since}}</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px"><strong style="font-size:20px;font-family:'Bricolage Grotesque',sans-serif">{{cur.ptsStr}} pts</strong><span style="color:#EBD8CB">{{cur.toNext}}</span></div><div style="height:8px;border-radius:999px;background:rgba(235,216,203,.18);overflow:hidden"><span style="display:block;height:100%;width:{{cur.pct}};background:#F2B9A6;border-radius:999px"></span></div></div>
      </div>
      <dl style="margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
        <div style="padding:12px;border-radius:14px;background:#F6F0E6"><dt style="font-size:12px;font-weight:700;color:#7A5530">Visits</dt><dd style="margin:4px 0 0;font-weight:700">{{cur.visits}}</dd></div>
        <div style="padding:12px;border-radius:14px;background:#F6F0E6"><dt style="font-size:12px;font-weight:700;color:#7A5530">This month</dt><dd style="margin:4px 0 0;font-weight:700">#{{cur.rank}} · {{cur.month}} pts</dd></div>
        <div style="padding:12px;border-radius:14px;background:#F6F0E6"><dt style="font-size:12px;font-weight:700;color:#7A5530">Leaderboard</dt><dd style="margin:4px 0 0;font-weight:700">{{cur.board}}</dd></div>
      </dl>
      <div style="display:flex;flex-direction:column;gap:4px">
        <p class="k">Points history</p>
        <sc-for list="{{history}}" as="h" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EADFD0;font-size:14px"><span style="width:62px" class="mut">{{h.date}}</span><span style="flex:1;min-width:0">{{h.what}}</span><strong style="color:{{h.color}}">{{h.pts}}</strong></div>
        </sc-for>
      </div>
      <div style="padding:16px;border-radius:18px;border:1.5px dashed #CDBFAC;display:flex;flex-direction:column;gap:10px">
        <strong style="font-size:15px">Adjust points <span class="mut" style="font-weight:500">· owner only</span></strong>
        <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px"><label class="fl">Points<input class="inp" value="+100" ></label><label class="fl">Reason<input class="inp" value="" placeholder="e.g. Missed check-in on 9 Nov"></label></div>
        <button type="button" class="btn green sm" style="align-self:flex-start">Save adjustment</button>
      </div>
    </section>
  </div>
</sc-if>

<sc-if value="{{isHistory}}" hint-placeholder-val="{{false}}">
  <section style="background:#FBF7F0;border:1px solid #E6DACA;border-radius:20px;overflow:hidden">
    <div style="display:flex;flex-wrap:wrap;gap:8px;padding:16px">

<sc-if value="{{isBoard}}" hint-placeholder-val="{{false}}">
