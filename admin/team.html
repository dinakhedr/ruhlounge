<script type="text/x-dc" id="js-AdminTeam">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'salma', perm: {}, inactive: {} };
  }
  renderVals() {
    const S = this.state;
    const P = [
      { k: 'owner', name: 'Ruh owner', short: 'Owner', phone: '[OWNER MOBILE]', role: 'Super admin', last: 'Now', bg: '#B4553E', fg: '#FFF8EE', ini: 'RO' },
      { k: 'salma', name: 'Salma K.', short: 'Salma', phone: '+20 100 ••• 4471', role: 'Staff · requests', last: '2 min ago', bg: '#B9834A', fg: '#1F2E24', ini: 'SK' },
      { k: 'hossam', name: 'Hossam E.', short: 'Hossam', phone: '+20 111 ••• 2093', role: 'Staff · requests', last: 'Today 3:15 PM', bg: '#EBD8CB', fg: '#1F2E24', ini: 'HE' },
      { k: 'yara', name: 'Yara M.', short: 'Yara', phone: '+20 122 ••• 7718', role: 'Staff · requests', last: 'Invite sent', bg: '#E3EADF', fg: '#26382C', ini: 'YM', invited: true }
    ];
    const PERMS = [
      ['bookings', 'Bookings', 'Review, assign tables, confirm on WhatsApp', true, false],
      ['events', 'Event requests', 'Confirm, decline, manage waitlists', true, false],
      ['home', 'Ruh at Home orders', 'Accept and update orders', true, false],
      ['checkins', 'Check-ins & bills', 'Confirm tables, enter bills, credit points', true, false],
      ['dash', 'Dashboard figures', 'Sales, members and weekly numbers', false, false],
      ['menu', 'Menu, photos & programme', 'Edit dishes, prices and events', false, false],
      ['points', 'Edit points', 'Adjust a member\'s balance', false, true],
      ['circle', 'Ruh Circle settings', 'Levels, rules and prizes', false, true],
      ['team', 'Team & Settings', 'Add people, change access', false, true]
    ];
    const all = P.map((p) => {
      const isOwner = p.k === 'owner';
      const status = isOwner ? 'Active' : (S.inactive[p.k] ? 'Off' : (p.invited ? 'Invited' : 'Active'));
      return Object.assign({}, p, { isOwner, isStaff: !isOwner, status, stCls: status === 'Active' ? 'pill p-green' : (status === 'Invited' ? 'pill p-wood' : 'pill p-grey'), roleCls: isOwner ? 'pill p-dark' : 'pill p-blue' });
    });
    const cur = all.find((p) => p.k === S.sel) || all[1];
    const pk = (k) => cur.k + '-' + k;
    return {
      people: all.map((p) => Object.assign({}, p, { cls: p.k === cur.k ? 'rowb sel' : 'rowb', pick: () => this.setState({ sel: p.k }) })),
      cur,
      perms: PERMS.map(([k, l, n, def, locked]) => {
        const v = S.perm[pk(k)];
        const on = locked ? false : (v === undefined ? def : v);
        return { label: l, note: locked ? n + ' · owner only' : n, on, locked, swCls: on ? 'sw on' : 'sw', lockStyle: locked ? 'opacity:.45;cursor:not-allowed' : '',
          toggle: () => { if (locked) return; const o = Object.assign({}, S.perm); o[pk(k)] = !on; this.setState({ perm: o }); } };
      }),
      activeLabel: S.inactive[cur.k] ? 'Switch access back on' : 'Switch off access',
      toggleActive: () => { const o = Object.assign({}, S.inactive); o[cur.k] = !o[cur.k]; this.setState({ inactive: o }); },
      log: [
        ['9:24 PM', 'Salma K.', 'Credited +204 points to Nour H. · Table 11'],
        ['9:10 PM', 'Salma K.', 'Confirmed booking BK-2382 · Table 11'],
        ['8:12 PM', 'Salma K.', 'Credited +172 points to Hana S. · Table 8'],
        ['5:40 PM', 'Ruh owner', 'Confirmed booking BK-2377 · Table 8'],
        ['3:15 PM', 'Hossam E.', 'Marked box BX-310 as delivered'],
        ['Tue', 'Ruh owner', 'Adjusted Karim F. +120 points · missed check-in']
      ].map(([t, who, what]) => ({ t, who, what }))
    };
  }
