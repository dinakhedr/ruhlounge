<script type="text/x-dc" id="js-AdminSettings">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { count: 24, area: {} };
  }
  renderVals() {
    const S = this.state;
    const order = ['in', 'ga', 'pe', 'off'];
    const names = { in: 'Indoor', ga: 'Garden', pe: 'Pergola', off: 'Off' };
    const def = (n) => n <= 10 ? 'in' : (n <= 18 ? 'ga' : 'pe');
    const tables = [];
    for (let n = 1; n <= S.count; n++) {
      const a = S.area[n] || def(n);
      tables.push({ n, area: names[a], cls: 'tbl a-' + a, aria: 'Table ' + n + ', ' + names[a] + '. Change area',
        pick: () => { const o = Object.assign({}, S.area); o[n] = order[(order.indexOf(a) + 1) % 4]; this.setState({ area: o }); } });
    }
    return {
      count: S.count, tables,
      less: () => this.setState({ count: Math.max(1, S.count - 1) }),
      more: () => this.setState({ count: Math.min(60, S.count + 1) }),
      templates: [
        ['Booking confirmed', 'Hi [name], your table at Ruh is confirmed. [date], [time] · [guests] guests · Table [table].'],
        ['Booking declined', 'Hi [name], sorry, we are fully booked at [time]. Reply here and we will find you another time.'],
        ['Event confirmed', 'Hi [name], your place at [event] on [date] is confirmed. See you there!'],
        ['Waitlist seat', 'Hi [name], a seat opened up at [event] on [date]. Reply YES within 2 hours to take it.'],
        ['Box update', 'Hi [name], your Ruh box [ref] is [ready for pick-up / on its way].'],
        ['Points credited', 'Hi [name], you earned +[points] Ruh Circle points tonight ([total] in total).']
      ].map(([t, b]) => ({ t, b }))
    };
  }
