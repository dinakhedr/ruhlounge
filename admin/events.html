    const AGO = ['40 min ago', '1 h ago', '2 h ago', 'Yesterday', '2 days ago'];
    const IMG = {"oud": "images/ev-oud.jpg", "family": "images/ev-family.jpg", "paint": "images/ev-paint.jpg", "brunch": "images/ev-brunch.jpg", "karaoke": "images/ev-karaoke.jpg", "openmic": "images/ev-openmic.jpg", "val": "images/ev-valentine.jpg", "ram": "images/ev-ramadan.jpg"};
    const cur = EV.find((e) => e.k === S.ev) || EV[0];
    const ei = EV.indexOf(cur);
    const d = Math.min(S.d, cur.dates.length - 1);
    const mk = (kind, i) => {
      const n = (ei * 5 + d * 3 + i + (kind === 'wait' ? 7 : 0)) % NAMES.length;
      return { ref: (kind === 'wait' ? 'WL-' : 'EV-') + (1042 + ei * 17 + d * 7 + i + (kind === 'wait' ? 300 : 0)), name: NAMES[n], phone: PH[n % PH.length], guests: G[(n + i) % G.length], note: NOTES[(n + d) % NOTES.length], ago: AGO[(i + d) % AGO.length], kind };
    };
    const pend = []; for (let i = 0; i < cur.pend[d]; i++) pend.push(mk('pend', i));
    const wait = []; for (let i = 0; i < Math.min(cur.wait[d], 6); i++) wait.push(mk('wait', i));
    const conf = []; for (let i = 0; i < Math.min(5, Math.ceil(cur.booked[d] / 4)); i++) conf.push(Object.assign(mk('conf', i + 10), { ago: 'Confirmed' }));
    const key = (r) => cur.k + '-' + d + '-' + r.ref;
    const setAct = (r, v) => { const a = Object.assign({}, S.act); a[key(r)] = v; this.setState({ act: a }); };
    let extra = 0;
    pend.concat(wait).forEach((r) => { const v = S.act[key(r)]; if (v === 'confirmed') extra += r.guests; });
    const booked = cur.booked[d] + extra;
    const pendLeft = pend.filter((r) => !S.act[key(r)]);
    const waitLeft = wait.filter((r) => !S.act[key(r)] || S.act[key(r)] === 'offered');
    const stamps = { confirmed: 'Confirmed · WhatsApp sent', declined: 'Declined · WhatsApp sent', offered: 'Seat offered · waiting for reply', removed: 'Removed from waitlist' };
    const pills = { confirmed: 'pill p-green', declined: 'pill p-grey', offered: 'pill p-wood', removed: 'pill p-grey' };
    const toRow = (r) => {
      const v = S.act[key(r)];
      const isWait = r.kind === 'wait';
      const canAct = r.kind !== 'conf' && (!v || (isWait && v === 'offered'));
      return Object.assign({}, r, {
        canAct, done: !canAct,
        stamp: r.kind === 'conf' ? 'Confirmed' : stamps[v],
        pillCls: r.kind === 'conf' ? 'pill p-green' : pills[v],
        yesLabel: isWait ? (v === 'offered' ? 'Move to confirmed' : 'Offer a seat') : 'Confirm',
        noLabel: isWait ? 'Remove' : 'Decline',
        yes: () => setAct(r, isWait && v !== 'offered' ? 'offered' : 'confirmed'),
        no: () => setAct(r, isWait ? 'removed' : 'declined')
      });
    };
    const tab = cur.seasonal ? 'waitlist' : S.tab;
    const lists = { requests: pend, waitlist: wait, confirmed: conf };
    const rows = (lists[tab] || pend).map(toRow);
    const tabsDef = cur.seasonal ? [['waitlist', 'Waitlist', cur.wait[d]]] : [['requests', 'Pending', pendLeft.length], ['waitlist', 'Waitlist', waitLeft.length], ['confirmed', 'Confirmed', booked + ' guests']];
    const foot = tab === 'confirmed' ? 'Showing the latest confirmed groups.' : (rows.length ? 'Oldest first. Each action sends the guest a WhatsApp message.' : 'Nothing waiting here.');
    return {
      events: EV.map((e) => {
        const p = e.pend.reduce((a, b) => a + b, 0);
        const flag = e.seasonal ? 'Waitlist ' + e.wait[0] : (p ? p + ' pending' : 'Up to date');
        return { name: e.name, when: e.when, on: e.k === cur.k, cls: e.k === cur.k ? 'evb on' : 'evb', flag, flagCls: e.seasonal ? 'pill p-wood' : (p ? 'pill p-terra' : 'pill p-green'), pick: () => this.setState({ ev: e.k, d: 0, tab: e.seasonal ? 'waitlist' : 'requests' }) };
      }),
      cur, hasImg: !!IMG[cur.k], curImg: IMG[cur.k] || '',
      dates: cur.dates.map((x, i) => ({ label: x, sub: cur.seasonal ? '' : cur.booked[i] + '/' + cur.cap, on: i === d, cls: i === d ? 'chip on' : 'chip', pick: () => this.setState({ d: i }) })),
      booked, capLabel: cur.seasonal ? cur.cap + ' (opens later)' : cur.cap,
      capPct: Math.min(100, Math.round(booked / cur.cap * 100)) + '%',
      capColor: booked >= cur.cap * 0.85 ? '#B4553E' : '#2F4536',
      pendCount: pendLeft.length, pendGuests: pendLeft.reduce((a, r) => a + r.guests, 0),
      waitCount: waitLeft.length, waitNote: cur.seasonal ? 'Guests asked to hear first' : (cur.wait[d] ? 'Full: offer seats if someone cancels' : 'No waitlist for this date'),
      tabs: tabsDef.map(([k, l, c]) => ({ label: l, count: c, on: tab === k, cls: tab === k ? 'tab on' : 'tab', pick: () => this.setState({ tab: k }) })),
      rows, footNote: foot,
      msg: 'Hi [name], your place at ' + cur.name + ' is confirmed.\n' + cur.dates[d] + ' · ' + (cur.seasonal ? '[TIME TO CONFIRM]' : cur.when.split(' · ')[1]) + ' · [guests] guests\nNo payment needed now [DEPOSIT POLICY TO CONFIRM]. You will earn +30 Ruh Circle points when you check in.\nRuh Lounge, Izar Plaza, Sheikh Zayed'
    };
  }
}

</script>
