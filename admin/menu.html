<style>
body{margin:0;background:#F6F0E6}
a{color:#2F4536}a:hover{color:#B4553E}

.mut{color:#5C6B60}
.big{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:40px;line-height:1;color:#1F2E24}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:#B4553E;color:#FFF8EE;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#2F4536;color:#FFF8EE}
.btn:disabled{background:#CDBFAC;color:#5A4A3A;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.green{background:#2F4536}.btn.green:hover{background:#B4553E}

.ghost:hover{background:#2F4536;border-color:#2F4536;color:#FFF8EE}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid #D9CBB8;background:transparent;font-family:inherit;font-size:14px;font-weight:700;color:#2F4536;cursor:pointer}
.tab:hover{border-color:#2F4536}
.tab.on{background:#2F4536;border-color:#2F4536;color:#FFF8EE}
.tab .n{font-size:12px;opacity:.8}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid #D9CBB8;background:#FFF;font-family:inherit;font-size:14px;font-weight:600;color:#2F4536;cursor:pointer}
.chip:hover{border-color:#2F4536}
.chip.on{background:#1F2E24;border-color:#1F2E24;color:#FFF8EE}
.inp{font-family:inherit;font-size:15px;font-weight:600;color:#1F2A22;background:#FFF;border:1.5px solid #E2D5C3;border-radius:14px;min-height:48px;padding:0 14px;box-sizing:border-box;width:100%}
.inp:focus{outline:none;border-color:#B4553E;box-shadow:0 0 0 4px rgba(180,85,62,.14)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.5;font-weight:500}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#2F4536}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid #EADFD0}
.rowb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border:0;border-top:1px solid #EADFD0;background:transparent;font-family:inherit;font-size:14px;color:#1F2A22;cursor:pointer}
.rowb:hover{background:#F3EBDF}
.rowb.sel{background:#FFF;box-shadow:inset 4px 0 0 #B4553E}
.th{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7A5530;background:#F3EBDF}
.bar{height:10px;border-radius:999px;background:#EADFD0;overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:#2F4536}
.wa{background:#E8F0E4;border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:14px;line-height:1.55;color:#1F2A22;white-space:pre-line}
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:999px;border:0;background:#CDBFAC;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFF;transition:left .2s}
.sw.on{background:#2F4536}
.sw.on::after{left:21px}
.ph{background:repeating-linear-gradient(135deg,#EFE6D8 0 10px,#E8DCCB 10px 20px);display:grid;place-items:center;color:#7A5530}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes ad-in{0%{transform:translateY(6px)}100%{transform:translateY(0)}}
.in{animation:ad-in .35s ease-out}
@keyframes ad-pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,85,62,.45)}50%{box-shadow:0 0 0 7px rgba(180,85,62,0)}}
.live{width:9px;height:9px;border-radius:50%;background:#B4553E;animation:ad-pulse 2s ease-in-out infinite;flex:none}
@media (prefers-reduced-motion:reduce){.in,.live{animation:none}}

.cat{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:600;color:#2F4536;text-align:left;cursor:pointer}
.cat:hover{background:#EFE6D8}
.cat.on{background:#2F4536;color:#FFF8EE}
.it{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid #EADFD0;background:transparent}
.it.sel{background:#FFF;box-shadow:inset 4px 0 0 #B4553E}
.it.off{opacity:.6}
.mb{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#EFE6D8;color:#9C8B76}
.mb.ok{background:#E3EADF;color:#26382C}
</style>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="font-size:14px;font-weight:600">Allergens [TO CONFIRM]</span><span class="mut" style="font-size:13px">Not set</span></div>
  </section>

<script type="text/x-dc" id="js-AdminMenu">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'mains', sel: 'mains-0', price: {}, applied: {}, off: {}, dirty: {}, published: 0 };
  }
