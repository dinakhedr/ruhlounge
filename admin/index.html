<script type="text/x-dc" id="js-AdminSignIn">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { phone: '', pass: '', err: '' }; }
  componentDidMount() {
    var u = window.AdmAuth && window.AdmAuth.get();
    if (u) location.replace(this.next(u));
  }
  next(u) { var m = /next=([^&]+)/.exec(location.search); return m ? decodeURIComponent(m[1]) : u.home; }
  renderVals() {
    const S = this.state;
    return {
      phone: S.phone, pass: S.pass, err: S.err,
      setPhone: (e) => this.setState({ phone: e.target.value, err: '' }),
      setPass: (e) => this.setState({ pass: e.target.value, err: '' }),
      fillOwner: () => this.setState({ phone: '100 111 2222', pass: 'owner@1234', err: '' }),
      fillStaff: () => this.setState({ phone: '100 333 4444', pass: 'staff@1234', err: '' }),
      submit: () => {
        const u = window.AdmAuth.signIn(S.phone, S.pass);
        if (!u) { this.setState({ err: 'That mobile and password do not match a team account. Tap a demo sign-in below.' }); return; }
        let n = this.next(u);
        if (u.role !== 'owner' && /dashboard|ruh-circle|menu|dish-photos|programme|add-event|add-dish|add-member|team|settings|add-freezer/.test(n)) n = u.home;
        location.href = n;
      }
    };
  }
}
</script>
