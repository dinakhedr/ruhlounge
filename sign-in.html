<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruh · Sign in</title>
<link rel="icon" href="images/logo.png">

</head>
<body>
<div id="app"></div>
<template id="tpl-SignInPass"><x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F0E6}
a{color:#2F4536}a:hover{color:#B4553E}
@keyframes si-zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes si-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes si-caret{0%,49%{opacity:1}50%,100%{opacity:.15}}
.si-zoom{animation:si-zoom 22s ease-in-out infinite}
.si-bob{animation:si-bob 4s ease-in-out infinite}
.si-caret{animation:si-caret 1s steps(1) infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#B4553E;color:#FFF8EE;text-decoration:none;font-family:inherit;font-weight:700;font-size:17px;min-height:56px;padding:0 28px;border-radius:999px;border:0;cursor:pointer;transition:background .3s,transform .3s}
.btn:hover{background:#2F4536;color:#FFF8EE;transform:translateY(-2px)}
.inp{font-family:inherit;font-size:18px;font-weight:600;color:#1F2A22;background:#FFF;border:1.5px solid #E2D5C3;border-radius:16px;min-height:58px;padding:0 18px;box-sizing:border-box}
.inp:focus{outline:none;border-color:#B4553E;box-shadow:0 0 0 4px rgba(180,85,62,.14)}
.code{width:58px;height:68px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:800;color:#2F4536;background:#FFF;border:1.5px solid #E2D5C3;border-radius:16px;box-sizing:border-box}
.code.f{border-color:#2F4536}
.code.now{border-color:#B4553E;box-shadow:0 0 0 4px rgba(180,85,62,.14)}
.lnk{font-family:inherit;font-size:15px;font-weight:700;color:#2F4536;background:none;border:0;padding:10px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:#B4553E}
@media (prefers-reduced-motion:reduce){.si-zoom,.si-bob,.si-caret{animation:none}}
.off{display:none!important}
@media (max-width:760px){
.si-side{flex-basis:100%!important;min-height:300px!important}
.si-side .si-big{font-size:34px!important}
.si-side .si-bob{display:none!important}
.si-side .si-logo{left:20px!important;top:20px!important;height:48px!important}
.si-side .si-cap{left:20px!important;right:20px!important;bottom:24px!important}
.si-main{padding:22px 18px!important}
.si-h{font-size:42px!important}
}
</style>
</helmet>
<div style="min-height:900px;display:flex;flex-wrap:wrap;background:#F6F0E6;color:#1F2A22;font-family:Figtree,'Segoe UI',sans-serif">

  <section class="si-side" aria-hidden="true" style="flex:1 1 560px;min-height:900px;position:relative;overflow:hidden;background:#1F2E24;color:#FFF8EE">
    <img class="si-zoom" src="images/sofa1.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,22,18,.35) 0%,rgba(16,22,18,.15) 40%,rgba(16,22,18,.85) 100%)"></div>
    <img class="si-logo" src="images/logo.png" alt="" style="position:absolute;left:56px;top:44px;height:64px;width:auto">
    <div class="si-cap" style="position:absolute;left:56px;right:56px;bottom:56px;display:flex;flex-direction:column;gap:18px">
      <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#E7C9A8">Ruh Circle</p>
      <p style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:58px;line-height:.98;letter-spacing:-.04em" class="si-big">A little extra soul for our <span style="color:#F2B9A6">regulars.</span></p>
      <div class="si-bob" style="align-self:flex-start;display:flex;gap:12px;align-items:center;background:rgba(251,247,240,.94);color:#2F4536;border-radius:20px;padding:14px 18px;box-shadow:0 20px 40px rgba(0,0,0,.25)">
        <span style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#B4553E;color:#FFF8EE"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"></path></svg></span>
        <span style="display:flex;flex-direction:column"><strong style="font-size:15px">Bookings, orders and points</strong><span style="font-size:13px;color:#5C6B60">All in one place, no app needed</span></span>
      </div>
    </div>
  </section>

  <main class="si-main" style="flex:1 1 520px;min-width:0;display:flex;flex-direction:column;padding:40px 6vw">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
      <a href="Main.dc.html" style="display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;text-decoration:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back to Ruh</a>
      <span style="font-size:14px;font-weight:700;color:#9A6A3C">Ruh Circle</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:470px;width:100%;margin:0 auto;padding:28px 0">
      <div class="{{outCls}}" style="display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9A6A3C">Sign in to Ruh Circle</p>
          <h1 class="si-h" style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:60px;line-height:.95;letter-spacing:-.04em;color:#2F4536">Welcome <span style="color:#B4553E">back.</span></h1>
          <p style="margin:0;font-size:18px;line-height:1.6;color:#4F5C52">{{lead}}</p>
        </div>
        <form onSubmit="{{submit}}" novalidate style="display:flex;flex-direction:column;gap:16px">
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:#2F4536">Mobile number
            <span style="display:flex;gap:10px"><span class="inp" style="display:flex;align-items:center;background:#EFE6D8;color:#2F4536">+20</span><input class="inp" type="tel" name="phone" autocomplete="tel-national" inputmode="tel" placeholder="100 571 6027" value="{{phone}}" onInput="{{setPhone}}" style="flex:1;min-width:0" aria-describedby="si-err"></span>
          </label>
          <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:#2F4536">Password
            <span style="position:relative;display:flex"><input class="inp" type="{{pwType}}" name="password" autocomplete="current-password" value="{{pw}}" onInput="{{setPw}}" style="flex:1;min-width:0;padding-right:78px" aria-describedby="si-err"><button type="button" class="lnk" onClick="{{toggle}}" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:14px">{{pwLabel}}</button></span>
          </label>
          <p id="si-err" role="alert" class="{{errCls}}" style="margin:0;display:flex;gap:8px;align-items:flex-start;background:#F7E1D9;color:#8E3B28;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45">{{err}}</p>
          <button type="submit" class="btn">Sign in</button>
        </form>
        <div style="display:flex;flex-direction:column;gap:8px;background:#EFE6D8;border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.5;color:#4F5C52">
          <strong style="color:#2F4536;font-size:13px;letter-spacing:.14em;text-transform:uppercase">Demo account</strong>
          <span>Mobile <strong style="color:#2F4536">+20 100 571 6027</strong> · Password <strong style="color:#2F4536">pass@1234</strong></span>
          <button type="button" class="lnk" onClick="{{fill}}" style="align-self:flex-start">Fill in the demo details</button>
        </div>
        <p style="margin:0;font-size:14px;line-height:1.55;color:#5C6B60">Not a member yet? <a href="CirclePageA2.dc.html" style="font-weight:700;color:#B4553E">See Ruh Circle</a>. Joining is free.</p>
      </div>
      <div class="{{inCls}}" style="display:flex;flex-direction:column;gap:20px">
        <p style="margin:0;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#9A6A3C">You're signed in</p>
        <h1 class="si-h" style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:60px;line-height:.95;letter-spacing:-.04em;color:#2F4536">Hello, <span style="color:#B4553E">Nour.</span></h1>
        <a href="{{nextHref}}" class="btn">Continue</a>
        <button type="button" class="lnk" onClick="{{signOut}}" style="align-self:flex-start">Sign out</button>
      </div>
    </div>

    <p style="margin:0;text-align:center;font-size:13px;color:#5C6B60">By continuing you agree to Ruh's <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
  </main>
</div>
</x-dc></template>
<script type="text/x-dc" id="js-SignInPass">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phone: '', pw: '', show: false, err: '' };
  }
  renderVals() {
    const S = this.state;
    const A = window.RuhAuth;
    const signed = !!(A && A.get());
    let next = 'profile.html';
    try { const q = new URLSearchParams(location.search).get('next'); if (q && /^[a-z0-9-]+\.html(\?[a-z0-9=&-]*)?$/i.test(q)) next = q; } catch (e) {}
    const go = () => { location.href = next; };
    return {
      phone: S.phone, pw: S.pw,
      pwType: S.show ? 'text' : 'password',
      pwLabel: S.show ? 'Hide' : 'Show',
      err: S.err, errCls: S.err ? '' : 'off',
      outCls: signed ? 'off' : '', inCls: signed ? '' : 'off',
      nextHref: next,
      lead: next === 'profile.html' ? 'Sign in with your mobile number and password to see your bookings, orders and points.' : 'Sign in first, then we will take you straight to the next step.',
      setPhone: (e) => this.setState({ phone: e.target.value, err: '' }),
      setPw: (e) => this.setState({ pw: e.target.value, err: '' }),
      toggle: () => this.setState({ show: !S.show }),
      fill: () => this.setState({ phone: '100 571 6027', pw: 'pass@1234', err: '' }),
      signOut: () => { A.signOut(); this.setState({ pw: '' }); },
      submit: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (!S.phone.trim() || !S.pw) { this.setState({ err: 'Please enter your mobile number and password.' }); return; }
        if (A.signIn(S.phone, S.pw)) go();
        else this.setState({ err: 'That mobile number and password do not match. Please try again.' });
      }
    };
  }
}
</script>
<script>window.RUH_PAGE={"views": [{"d": "SignInPass"}], "bp": 760};</script>
<script src="js/ruh.js"></script>
</body>
</html>
