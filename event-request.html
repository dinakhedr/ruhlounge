<section style="padding:48px 5vw 80px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:start">
<div style="display:flex;flex-direction:column;gap:26px">
  <a href="EventsPageB.dc.html" style="font-size:14px;font-weight:700;color:#2F4536;text-decoration:none">← Back to What's on</a>
  <div style="display:flex;flex-direction:column;gap:10px"><p class="eb">Event request</p><h1 class="h2" style="font-size:64px">Save your spot at <span style="color:#B4553E">{{ev.title}}.</span></h1><p style="margin:0;font-size:17px;line-height:1.55;color:#4A5547">Send your request and our team confirms it on WhatsApp, usually within a few hours.</p></div>
  <div class="fld"><label>Event</label><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><sc-for list="{{evs}}" as="o" hint-placeholder-count="9"><button type="button" class="{{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.go}}">{{o.title}}<small>{{o.short}}</small></button></sc-for></div></div>
  <div class="fld"><label>Date</label><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><sc-for list="{{dates}}" as="d" hint-placeholder-count="3"><button type="button" class="{{d.cls}}" aria-pressed="{{d.on}}" onClick="{{d.go}}">{{d.label}}<small>{{d.sub}}</small></button></sc-for></div></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div class="fld"><label for="eb-name">Your name</label><input id="eb-name" class="inp" placeholder="Nour Ahmed" value="{{name}}" onInput="{{setName}}"><span class="err">{{eName}}</span></div>

  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><button type="button" class="btn" style="min-height:58px;font-size:17px;padding:0 30px;border:0;cursor:pointer;font-family:inherit" onClick="{{send}}">Send request</button><span style="font-size:14px;color:#5C6B60">Members collect +30 Circle points for joining an event. <a href="CirclePageA2.dc.html" style="color:#B4553E;font-weight:700">Join the Circle</a></span></div>
</div>
<aside style="position:sticky;top:20px;display:flex;flex-direction:column;gap:16px">

      <span style="font-size:15px;line-height:1.5;color:#4A5547">{{ev.line}}</span>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;font-size:15px;color:#2F4536">
        <span>📅 <b>{{dLabel}}</b></span><span>🕘 {{ev.time}}</span><span>👥 {{n}} {{gWord}}</span><span>💳 {{ev.price}}</span></div>
    </div>
  </div>

    <span style="width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#F2B9A6;color:#1F2E24;font-size:26px">✓</span>
    <strong style="font-family:'Bricolage Grotesque',sans-serif;font-size:28px">Request received, {{first}}.</strong>
    <span style="font-size:15px;line-height:1.5;color:rgba(255,248,238,.85)">We'll confirm your spot at {{ev.title}} on {{dLabel}} on WhatsApp at {{wa}}. Reference [EV-1042].</span>
    <a href="https://wa.me/201044055999" class="btn blush" style="align-self:flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"></path></svg>Message us on WhatsApp</a>

<script type="text/x-dc" id="js-EventBook">
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { e: 'oud', d: 0, n: 2, name: '', wa: '', done: false, tried: false }; }
  renderVals(){
    const E = [{"id": "karaoke", "type": "Social night", "title": "Karaoke night", "line": "Arabic and English hits. Grab the mic or cheer your friends on.", "day": "Tue", "date": "17", "mon": "Nov", "time": "Every Tuesday · 9 PM – 12 AM", "price": "Free entry", "left": "Tables filling fast", "pct": 55, "img": "images/ev-karaoke.jpg", "cta": "Book a table →", "pos": "center 50%"}, {"id": "openmic", "type": "Social night", "title": "Open mic", "line": "Music or stand-up comedy. Sign up to perform, or just sit back and watch.", "day": "Wed", "date": "18", "mon": "Nov", "time": "Every Wednesday · 8 – 10:30 PM", "price": "Free entry", "left": "Performer slots open", "pct": 40, "img": "images/ev-openmic.jpg", "cta": "Book a table →", "pos": "center 50%"}, {"id": "family", "type": "Family", "title": "Family Friday", "line": "Storytelling, colouring, face painting and a painting table, while you enjoy breakfast.", "day": "Fri", "date": "20", "mon": "Nov", "time": "Every Friday · 10 AM – 1 PM", "price": "Free with breakfast", "left": "For kids 3 to 10", "pct": 45, "img": "images/ev-family.jpg", "cta": "Book a table →", "pos": "center 50%"}, {"id": "oud", "type": "Live music", "title": "Oud night", "line": "Classic Arabic and Egyptian songs on the oud over dinner.", "day": "Fri", "date": "20", "mon": "Nov", "time": "Every Friday · 9 PM – 12 AM", "price": "Free entry", "left": "Tables filling fast", "pct": 65, "img": "images/ev-oud.jpg", "cta": "Book a table →", "pos": "center 50%"}, {"id": "paint", "type": "Workshop", "title": "Sip & Paint breakfast", "line": "Paint a small canvas over breakfast and coffee. All materials included.", "day": "Sat", "date": "21", "mon": "Nov", "time": "Monthly · Saturday 10 AM – 12:30 PM", "price": "EGP 950 incl. breakfast [TO CONFIRM]", "left": "8 seats left", "pct": 60, "img": "images/ev-paint.jpg", "cta": "Book a seat →", "pos": "center 50%"}, {"id": "brunch", "type": "Live music", "title": "Live brunch", "line": "Soft acoustic sets while you share brunch with friends and family.", "day": "Sat", "date": "21", "mon": "Nov", "time": "Every Saturday · 12 – 3 PM", "price": "Free entry", "left": "Tables filling fast", "pct": 50, "img": "images/ev-brunch.jpg", "cta": "Book a table →", "pos": "center 50%"}, {"id": "valentine", "type": "Seasonal", "title": "Valentine's dinner", "line": "A candlelit set menu with live acoustic music.", "day": "Sun", "date": "14", "mon": "Feb", "time": "Coming soon · 7 – 11 PM", "price": "Set menu [TO CONFIRM]", "left": "Booking opens soon", "pct": 0, "img": "images/ev-valentine.jpg", "cta": "Notify me →", "pos": "center 50%"}, {"id": "ramadan", "type": "Seasonal", "title": "Ramadan nights", "line": "Suhoor under the lanterns, with oud on chosen nights.", "day": "2027", "date": "TBC", "mon": "Ramadan", "time": "Coming soon · nightly 9 PM – 2 AM", "price": "Suhoor menu [TO CONFIRM]", "left": "Dates announced soon", "pct": 0, "img": "images/ev-ramadan.jpg", "cta": "Notify me →", "pos": "center 50%"}];
    const D = {"karaoke": [["Tue 17 Nov", "Next"], ["Tue 24 Nov", ""], ["Tue 1 Dec", ""]], "openmic": [["Wed 18 Nov", "Next"], ["Wed 25 Nov", ""], ["Wed 2 Dec", ""]], "family": [["Fri 20 Nov", "Next"], ["Fri 27 Nov", ""], ["Fri 4 Dec", ""]], "oud": [["Fri 20 Nov", "Next"], ["Fri 27 Nov", ""], ["Fri 4 Dec", ""]], "paint": [["Sat 21 Nov", "Next"], ["Sat 19 Dec", "Monthly"], ["Sat 16 Jan", "Monthly"]], "brunch": [["Sat 21 Nov", "Next"], ["Sat 28 Nov", ""], ["Sat 5 Dec", ""]], "valentine": [["Sun 14 Feb", "Waitlist"], ["", ""], ["", ""]], "ramadan": [["Ramadan 2027", "Waitlist"], ["", ""], ["", ""]]};
    const S = this.state;
    const ev = E.find((x) => x.id === S.e) || E[0];
    const ds = (D[ev.id] || []).filter((x) => x[0]);
    const di = Math.min(S.d, ds.length - 1);
    const okName = S.name.trim().length > 1, okWa = S.wa.replace(/\D/g, '').length >= 10;
    return {
      ev, n: S.n, name: S.name, wa: S.wa, first: (S.name.trim().split(' ')[0] || 'there'),
      gWord: S.n === 1 ? 'guest' : 'guests', nNote: S.n >= 8 ? 'For 8 or more, we will call to arrange a bigger table.' : '',
      evs: E.map((x) => ({ title: x.title, short: x.time.split(' · ')[0], on: x.id === ev.id ? 'true' : 'false', cls: x.id === ev.id ? 'opt on' : 'opt', go: () => this.setState({ e: x.id, d: 0, done: false }) })),
      dates: ds.map((x, i) => ({ label: x[0], sub: x[1] || ' ', on: i === di ? 'true' : 'false', cls: i === di ? 'opt on' : 'opt', go: () => this.setState({ d: i, done: false }) })),
      dLabel: ds[di] ? ds[di][0] : '',
      minus: () => this.setState({ n: Math.max(1, S.n - 1), done: false }), plus: () => this.setState({ n: Math.min(12, S.n + 1), done: false }),
      setName: (e) => this.setState({ name: e.target.value, done: false }), setWa: (e) => this.setState({ wa: e.target.value, done: false }),
      eName: S.tried && !okName ? 'Enter your name' : '', eWa: S.tried && !okWa ? 'Enter a valid WhatsApp number' : '',
      send: () => this.setState({ tried: true, done: okName && okWa }),
      doneCls: S.done ? '' : 'off', noteCls: S.done ? 'off' : ''
    };
  }
}
</script>
